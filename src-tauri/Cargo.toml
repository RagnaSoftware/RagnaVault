[package]
name = "ragnavault"
version = "3.0.0"
description = "RagnaVault – Passwort-Manager und 2FA-Authenticator von RagnaSoftware"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
data-encoding = "2"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
arboard = "3"

# Argon2 mit 64 MiB ist unoptimiert quälend langsam – auch im Debug-Build optimieren.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
